# MCP Streaming HTTP Test Server - Docker Compose
version: '3.8'

services:
  mcp-test-server:
    build: .
    container_name: mcp-test-server
    ports:
      - "3001:3001"
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "wget -qO- http://localhost:3001/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
